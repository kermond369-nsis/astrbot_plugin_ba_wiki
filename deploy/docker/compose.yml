# arona 转发器（纯 HTTP）
#
#   容器只监听容器内 30303，宿主机只绑 127.0.0.1:3030 —— 公网访问一律经过前置反代。
#   cd deploy/docker
#   cp .env.example .env && vi .env
#   mkdir -p secrets && printf '%s\n' '你的QQ号:密钥' > secrets/arona_token
#   docker compose up -d
services:
  arona-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: arona-proxy:latest
    container_name: arona-proxy
    restart: unless-stopped
    # 只绑回环：外部无法直接摸到这个 HTTP 口，必须经反代
    ports:
      - "127.0.0.1:${HOST_PORT:-3030}:30303"
    environment:
      PROXY_PORT: "30303"
      PROXY_TLS: "0"
      PROXY_KEY: "${PROXY_KEY:?请在 .env 里设置 PROXY_KEY，用 openssl rand -hex 16 生成}"
      ARONA_TOKEN_FILE: /run/secrets/arona_token
    volumes:
      - ./secrets/arona_token:/run/secrets/arona_token:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
