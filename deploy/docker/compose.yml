# arona 中转（token 注入）—— 运行态配置，直接用镜像起，不在这里构建。
#
# 部署目录长这样：
#   /opt/aronaproxy/compose.yml          ← 本文件
#   /opt/aronaproxy/config/proxy.env     ← PROXY_KEY 等
#   /opt/aronaproxy/config/arona_token.txt ← <QQ号>:<密钥>
#
# 起：docker compose up -d
services:
  arona-relay:
    # 官方构建的镜像（GitHub Actions 自动发布，amd64 + arm64 双架构）：
    #   docker compose pull && docker compose up -d
    # 想用本地自己编译的，把下面这行换成本地 tag（docker build -t arona-relay:1.0.0 .）
    image: ghcr.io/kermond369-nsis/arona-relay:1.0.0
    container_name: arona-relay
    restart: unless-stopped

    # 只绑回环：公网摸不到 3030，一切访问都经你自己的反代（HTTPS / 域名 / 鉴权都在那边）
    # 反代在别的机器或容器里时，改成 "0.0.0.0:3030:30303" 或用 docker 网络（见 README）
    ports:
      - "127.0.0.1:3030:30303"

    volumes:
      # 配置全在 ./config，只读挂载；换 token 不用重启容器
      - ./config:/config:ro

    # 加固：只读根文件系统 + 丢掉全部 capability + 禁提权
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:30303/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
